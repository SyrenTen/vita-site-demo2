<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vitaliia's Portfolio</title>

  <!-- Your existing styles -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="inventory.css" />
  <link href="https://fonts.googleapis.com/css?family=Fira+Code" rel="stylesheet" />

  <style>
    :root, html, body {
      height: 100%;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #1f2428; /* match your theme */
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    header.header {
      position: relative;
      z-index: 100;
      margin: 0;
    }
    #contentWrapper {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }
    #contentFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    #radio-player-container {
      position: fixed; /* Float anywhere over page */
      z-index: 200;
    }
  </style>
</head>
<body>
  <!-- HEADER (persistent) -->
  <header class="header">
    <div class="head-button" id="inventory-button">Funny inventory</div>

    <div id="funny-inventory" class="inventory-popup" style="display:none;">
      <div class="inventory-content">
        <div class="inventory-item" id="radio-inventory-item">
          <img src="images/radio-inventory.svg" alt="Radio Icon" />
        </div>
      </div>
    </div>

    <!-- Radio -->
    <div id="radio-player-container" style="display:none; top:20px; left:20px;">
      <div id="radio-player">
        <img id="radio-image" src="images/radio-inventory.svg" alt="Radio Player" />
        <div id="youtube-player"></div>
        <div class="close-button" id="close-radio">&times;</div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
      <a href="index.html" target="contentFrame">Home</a>
      <a href="education.html" target="contentFrame">Education</a>
      <a href="experience.html" target="contentFrame">Experience</a>
      <a href="research.html" target="contentFrame">Research</a>
      <a href="projects.html" target="contentFrame">Projects</a>
    </nav>

    <button id="toggle-tech" class="head-button" style="display:none;">Tech Details</button>

    <button class="head-button">Lang</button>
  </header>

  <!-- MAIN CONTENT -->
  <div id="contentWrapper">
    <iframe id="contentFrame" name="contentFrame" src="index.html"></iframe>
  </div>


  <script>
    const contentFrame = document.getElementById('contentFrame');
    const techButton   = document.getElementById('toggle-tech');

    function setTechButtonVisible(v) {
      techButton.style.display = v ? 'inline-block' : 'none';
      if (!v) techButton.textContent = 'Tech Details'; // reset text if hidden
    }

    // Start hidden
    setTechButtonVisible(false);

    // Listen for messages from child
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.__portfolioTech !== true) return;

      if (d.type === 'available') {
        setTechButtonVisible(true);
      } else if (d.type === 'unavailable') {
        setTechButtonVisible(false);
      } else if (d.type === 'modeChanged') {
        // child tells us mode switched
        techButton.textContent = d.active ? 'Simple Version' : 'Tech Details';
      }
    });

    // Inject anti-gap style only
    contentFrame.addEventListener('load', function () {
      try {
        const frameDoc = this.contentDocument || this.contentWindow.document;
        const style = frameDoc.createElement('style');
        style.textContent = `
          html, body { margin:0; padding:0; }
          body > *:first-child { margin-top: 0 !important; }
        `;
        frameDoc.head.appendChild(style);
      } catch {}
    });

    // Button click → tell child to toggle
    techButton.addEventListener('click', () => {
      try {
        contentFrame.contentWindow.postMessage({ __portfolioTech: true, type: 'toggle' }, '*');
      } catch {}
    });
  </script>






  <!-- Inventory + radio logic -->
  <script src="funny-inventory.js"></script>
</body>
</html>
