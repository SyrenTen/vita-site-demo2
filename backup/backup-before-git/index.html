<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitaliia's Portfolio</title>

  <!-- Your existing styles -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="inventory.css" />
  <link href="https://fonts.googleapis.com/css?family=Fira+Code" rel="stylesheet" />

  <style>
    :root, html, body { height: 100%; }
    html, body {
      margin: 0;
      padding: 0;
      background: #1f2428; /* match your theme */
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    header.header {
      position: relative;
      z-index: 100;
      margin: 0;
      transition: opacity .2s ease;
    }
    /* When a lightbox inside the iframe is open, we dim/hide header and disable clicks */
    body.dim-header header.header,
    body.dim-header #radio-player-container,
    body.dim-header #funny-inventory {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      position: absolute;
    }

    #contentWrapper {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }
    #contentFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    #radio-player-container {
      position: fixed; /* Float anywhere over page */
      z-index: 200;
    }
  </style>
</head>
<body>
  <!-- HEADER (persistent) -->
  <header class="header">
    <div class="head-button" id="inventory-button">Funny inventory</div>

    <div id="funny-inventory" class="inventory-popup" style="display:none;">
      <div class="inventory-content">
        <div class="inventory-item" id="radio-inventory-item">
          <img src="images/radio-inventory.svg" alt="Radio Icon" />
        </div>
      </div>
    </div>

    <!-- Radio -->
    <div id="radio-player-container" style="display:none; top:20px; left:20px;">
      <div id="radio-player">
        <img id="radio-image" src="images/radio-inventory.svg" alt="Radio Player" />
        <div id="youtube-player"></div>
        <div class="close-button" id="close-radio">&times;</div>
      </div>
    </div>
    

    <!-- Navigation -->
    <button class="hamburger" id="hamburger-btn" aria-label="Menu">☰</button>

    <nav class="navbar" id="navbar">
      <a href="home.html" target="contentFrame">Home</a>
      <a href="education.html" target="contentFrame">Education</a>
      <a href="experience.html" target="contentFrame">Experience</a>
      <a href="research.html" target="contentFrame">Research</a>
      <a href="projects.html" target="contentFrame">Projects</a>
    </nav>

    <button class="head-button">Lang</button>
  </header>

  <!-- MAIN CONTENT -->
  <div id="contentWrapper">
    <iframe id="contentFrame" name="contentFrame"></iframe>
  </div>

  <script>
    
    (function persistIframeRoute() {
      const frame = document.getElementById('contentFrame');

      // Normalize relative paths to just filename + query + hash
      function normalize(src) {
        if (!src) return '';
        try {
          const u = new URL(src, window.location.href);
          // keep full relative path, not just filename
          return u.pathname.replace(/^\//, '') + (u.search || '') + (u.hash || '');
        } catch {
          return src.replace(/^\.?\//, '');
        }
      }


      function setFrame(src) {
        const norm = normalize(src) || 'home.html';
        if (normalize(frame.getAttribute('src')) !== norm) {
          frame.setAttribute('src', norm);
        }
        localStorage.setItem('lastIframePage', norm);
        location.hash = encodeURIComponent(norm);
      }

      // Intercept ALL in-iframe links with target=contentFrame (navbar, books, read-me links)
      document.addEventListener('click', (e) => {
        const a = e.target.closest('a[href]');
        if (!a) return;

        if (a.getAttribute('target') === 'contentFrame') {
          e.preventDefault();
          setFrame(a.getAttribute('href'));

          // --- Auto-close mobile navbar ---
          const navbar = document.getElementById('navbar');
          const hamburger = document.getElementById('hamburger-btn');
          if (navbar.classList.contains('active')) {
            navbar.classList.remove('active');
            hamburger.textContent = '☰'; // Reset hamburger icon
          }
        }
      });

      // On full reload: restore last iframe page
      const fromHash  = decodeURIComponent(location.hash.slice(1) || '');
      const fromStore = localStorage.getItem('lastIframePage');
      setFrame(fromHash || fromStore || 'home.html');

      // Whenever iframe finishes loading → record its actual URL
      frame.addEventListener('load', () => {
        try {
          const norm = normalize(frame.contentWindow.location.href);
          if (norm) {
            localStorage.setItem('lastIframePage', norm);
            location.hash = encodeURIComponent(norm);
          }
        } catch {}
      });

      // Back/forward buttons work
      window.addEventListener('hashchange', () => {
        const src = decodeURIComponent(location.hash.slice(1) || '');
        if (src) setFrame(src);
      });
    })();

    // Dim header when lightbox inside iframe is open
    (function initHeaderLightboxDim() {
      const frame = document.getElementById('contentFrame');
      window.addEventListener("message", (ev) => {
        if (ev.source !== frame.contentWindow) return;

        // Navigation sync
        if (ev.data?.type === "IFRAME_NAV") {
          localStorage.setItem("lastIframePage", ev.data.page);
          location.hash = encodeURIComponent(ev.data.page);
        }

        // Lightbox toggle → dim header
        if (ev.data?.type === "LIGHTBOX_TOGGLE") {
          if (ev.data.open) {
            document.body.classList.add("dim-header");
          } else {
            document.body.classList.remove("dim-header");
          }
        }
      });
    })();

    document.addEventListener("DOMContentLoaded", () => {
      const hamburger = document.getElementById("hamburger-btn");
      const navbar = document.getElementById("navbar");

      if (hamburger && navbar) {
        hamburger.addEventListener("click", () => {
          navbar.classList.toggle("active");
          hamburger.textContent = navbar.classList.contains("active") ? "✕" : "☰";
        });
      }
    });

    
  </script>


  <!-- Inventory + radio logic -->
  <script src="funny-inventory.js"></script>
</body>
</html>
